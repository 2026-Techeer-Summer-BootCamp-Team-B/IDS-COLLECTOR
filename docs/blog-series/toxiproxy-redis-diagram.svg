<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>toxiproxy가 세 서비스와 Redis 사이에 끼어드는 구조</title>
<desc>normalizer, correlation-engine, platform-api 세 서비스가 REDIS_URL을 통해 redis-toxiproxy로 연결되고, redis-toxiproxy가 toxic을 적용한 뒤 진짜 redis로 요청을 전달한다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect width="680" height="400" fill="#1a1a1a"/>

<g>
<rect x="50" y="40" width="180" height="60" rx="4" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="140" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#D3D1C7">normalizer</text>
<text x="140" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#B4B2A9">dedupe 키 저장</text>
</g>

<g>
<rect x="250" y="40" width="180" height="60" rx="4" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#D3D1C7">correlation-engine</text>
<text x="340" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#B4B2A9">임계값/서킷 상태</text>
</g>

<g>
<rect x="450" y="40" width="180" height="60" rx="4" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="540" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#D3D1C7">platform-api</text>
<text x="540" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#B4B2A9">로그인 세션</text>
</g>

<path d="M140 100 L340 160" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 100 L340 160" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M540 100 L340 160" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<text x="340" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#B4B2A9">REDIS_URL을 여기로 변경</text>

<g>
<rect x="220" y="160" width="240" height="70" rx="4" fill="#712B13" stroke="#D85A30" stroke-width="0.5"/>
<text x="340" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#F5C4B3">redis-toxiproxy</text>
<text x="340" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#F0997B">:16379, toxic 주입 지점</text>
</g>

<path d="M340 230 L340 280" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="340" y="255" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#B4B2A9">toxic 없으면 그대로 전달</text>

<g>
<rect x="250" y="280" width="180" height="60" rx="4" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#D3D1C7">redis</text>
<text x="340" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#B4B2A9">:6379, 진짜 Redis</text>
</g>
</svg>
